name: ✨ پیشنهاد امکانات
description: ایده یا امکان جدیدی برای برنامه پیشنهاد دهید
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ پیشنهاد امکانات جدید
        ممنون که به فکر بهتر شدن «روز من» هستید! 💚
        لطفاً پیشنهادتون رو کامل توضیح بدید.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: پیش‌نیازها
      options:
        - label: چک کردم که این پیشنهاد قبلاً داده نشده باشه
          required: true

  - type: textarea
    id: problem
    attributes:
      label: مشکل یا نیاز
      description: چه مشکلی دارید که این امکان حلش می‌کنه؟
      placeholder: مثلاً برای برنامه‌ریزی هفتگی، نیاز به قابلیت X دارم
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: راه‌حل پیشنهادی
      description: دقیقاً چه امکانی رو پیشنهاد می‌دید؟
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: راه‌حل‌های جایگزین (اختیاری)
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: اهمیت پیشنهاد
      options:
        - کم — فکر می‌کنم خوب باشه
        - متوسط — واقعاً بهش نیاز دارم
        - زیاد — بدون این قابلیت نمی‌تونم
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: اطلاعات اضافی (اختیاری)
    validations:
      required: false
